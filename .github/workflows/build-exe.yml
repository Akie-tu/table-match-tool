name: Build EXE on Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pyinstaller openpyxl pillow

      - name: Build GUI EXE (single-file)
        run: |
          pyinstaller --onefile --windowed --name table-match-gui --icon=app.ico --add-data "app.ico;." --add-data "invoice_template.xlsx;." table_match_gui.py

      - name: Generate checksum
        shell: bash
        run: |
          cd dist && sha256sum table-match-gui.exe > checksum.txt && cat checksum.txt

      - name: Get version tag
        id: ver
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract update log (last commit message)
        id: log
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "body=## 更新日志 (v${{ steps.ver.outputs.tag }})
          
          $MSG

          ### 下载
          - **table-match-gui.exe** — GUI版（单文件双击运行，支持内置更新）
          
          " > body_file.txt
          echo "Done"

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: body_file.txt
          files: |
            dist/table-match-gui.exe
            dist/checksum.txt
          fail_on_unmatched_files: false